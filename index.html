<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Manager</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Authentication Container -->
    <div id="auth-container" class="container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back</h2>
                <p>Manage your tasks efficiently</p>
            </div>
            
            <div class="auth-tabs">
                <button class="tab-btn active" id="tab-login">Login</button>
                <button class="tab-btn" id="tab-signup">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form">
                <div class="input-group">
                    <label for="login-email">Email</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="login-email" required placeholder="Enter your email">
                    </div>
                </div>
                <div class="input-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" required placeholder="Enter your password">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
                <p class="form-error" id="login-error"></p>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="auth-form hidden">
                <div class="input-group">
                    <label for="signup-name">Full Name</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" id="signup-name" required placeholder="Enter your full name">
                    </div>
                </div>
                <div class="input-group">
                    <label for="signup-email">Email</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="signup-email" required placeholder="Enter your email">
                    </div>
                </div>
                <div class="input-group">
                    <label for="signup-password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="signup-password" required placeholder="Create a password">
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strength-bar"></div>
                        <span class="strength-text" id="strength-text">Password strength</span>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign Up</button>
                <p class="form-error" id="signup-error"></p>
            </form>
        </div>
    </div>

    <!-- Main Dashboard Container -->
    <div id="dashboard-container" class="dashboard-layout hidden">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-list-check"></i> TaskMaster</h2>
            </div>
            <div class="user-info">
                <div class="avatar" id="user-avatar">U</div>
                <div>
                    <h3 id="user-name-display">User Name</h3>
                    <p class="user-status">Student</p>
                </div>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-filter="all"><i class="fa-solid fa-layer-group"></i> All Tasks</button>
                <button class="nav-btn" data-filter="pending"><i class="fa-regular fa-clock"></i> Pending</button>
                <button class="nav-btn" data-filter="completed"><i class="fa-regular fa-circle-check"></i> Completed</button>
            </nav>
            <div class="sidebar-footer">
                <button id="theme-toggle" class="btn-icon" aria-label="Toggle dark mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button id="logout-btn" class="btn btn-secondary btn-sm"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <header class="main-header">
                <div class="header-left">
                    <h1 id="greeting">Hello!</h1>
                    <p>Here's your task summary for today.</p>
                </div>
                <button id="add-task-btn" class="btn btn-primary"><i class="fa-solid fa-plus"></i> New Task</button>
            </header>

            <div class="controls-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="search-input" placeholder="Search tasks...">
                </div>
                <div class="filters">
                    <select id="priority-filter" class="custom-select">
                        <option value="all">All Priorities</option>
                        <option value="high">High</option>
                        <option value="medium">Medium</option>
                        <option value="low">Low</option>
                    </select>
                    <select id="sort-select" class="custom-select">
                        <option value="deadline-asc">Deadline (Earliest)</option>
                        <option value="deadline-desc">Deadline (Latest)</option>
                        <option value="priority-desc">Priority (High to Low)</option>
                    </select>
                </div>
            </div>

            <div class="tasks-board" id="tasks-container">
                <!-- Task items will be injected here via JS -->
            </div>
        </main>
    </div>

    <!-- Task Modal -->
    <div id="task-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add New Task</h3>
                <button id="close-modal" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="task-form">
                <input type="hidden" id="task-id">
                <div class="input-group">
                    <label for="task-title">Title</label>
                    <input type="text" id="task-title" required placeholder="e.g., Complete Math Assignment">
                </div>
                <div class="input-group">
                    <label for="task-desc">Description</label>
                    <textarea id="task-desc" rows="3" placeholder="Add some details..."></textarea>
                </div>
                <div class="form-row">
                    <div class="input-group">
                        <label for="task-deadline">Deadline</label>
                        <input type="date" id="task-deadline" required>
                    </div>
                    <div class="input-group">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority" required class="custom-select">
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" id="cancel-task" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="save-task-btn">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
